# BirdNET W06C (Grand Teton / AMK Ranch, Moran WY) — microphone job
# ─────────────────────────────────────────────────────────────────────────────
# Replaces gojian's avian-diversity-monitoring job on W06C with OUR
# birdnet-species rewrite, matching his sampling/inference rate and adding real
# eBird seasonal geo-filtering (which his job lacked).
#
# LOCATION / GEO-FILTERING — explicit coords for now (live-GPS is a follow-up):
#   W06C DOES publish a healthy live GPS stream (verified 2026-07-11:
#   sys.gps.lat=43.94, lon=-110.64, mode 3 / 3D fix, 7-8 sats, ~2 min cadence),
#   so the plan was to self-locate via --gps-subscribe. But a live test (job 5680,
#   2026-07-11) proved that does NOT work yet: the app opens a 3 s
#   plugin.subscribe on sys.gps.*, and with GPS publishing only every ~2 min the
#   window almost always misses it -> "No node location available -> geo-filtering
#   disabled" (classifies vs the GLOBAL list, not Teton-filtered). W06C is a FIXED
#   node, so we pass its coords explicitly below to engage the eBird filter now.
#   FOLLOW-UP (with pywaggle2): change the live-GPS path to read the LAST cached
#   sys.gps.* value instead of a short subscribe, then drop --lat/--lon for true
#   self-location (also enables mobile nodes). See app.py _coords_from_live_gps.
#
# MATCHING gojian's current rate (observed on the data plane 2026-07-11):
#   ~2-minute cadence, ~20 s audio capture (his old --sound_int 20), ~3 s
#   inference. So: cron '*/2 * * * *' + --duration 20. Use '* * * * *' to match
#   his exact per-minute cadence if desired (note: BirdNET reloads the model each
#   one-shot tick — ~14 s cold start — so */2 wastes less time than */1).
#
# OTHER DEFAULTS (deliberate for W06C's full-quality ETS ML1-WS IP mic):
#   --min-confidence 0.35 — inclusive floor for quiet/distant birds; the mic is
#     clean 48 kHz (unlike the faint 16 kHz H00F Reolink substream), so no need
#     to drop lower. Raise toward ~0.5 if the site proves noisy.
#   NO --bandpass-fmax — the mic is full 48 kHz, so the default 15 kHz ceiling is
#     correct. (The 8000 used on H00F is ONLY for the 16 kHz Reolink substream.)
#   --save-match "*:0.5" — archive a FLAC clip for any detection >=0.5 (above the
#     0.35 publish floor, so we only keep clips worth reviewing). Remove the arg
#     to publish detection topics only and save no audio.
#   NO --camera — birdnet defaults to the node microphone via wes-audio-server.
#   NO gpu selector — BirdNET V2.4 is TFLite/CPU; it does not need the GPU.
#
# IMAGE: beckman/birdnet-species:0.2.1 is an ECR-built CPU plugin (python:3.12-
#   slim, no CUDA), so it PULLS from the registry on W06C — no native build / no
#   k3s side-load needed (unlike the NVIDIA-base yolo/bioclip plugins).
#
# Submit (verified sesctl syntax):
#   sesctl --server https://es.sagecontinuum.org --token "$SES_USER_TOKEN" create -f jobs/birdnet-w06c-gps.yaml
#   sesctl --server https://es.sagecontinuum.org --token "$SES_USER_TOKEN" submit -j <numeric-job-id>
# Check:   sesctl ... stat -j <id>
# Suspend: sesctl ... rm -s <id>
# Remove:  sesctl ... rm <id>   (suspend first if Running)
# ─────────────────────────────────────────────────────────────────────────────
name: birdnet-w06c-gps
plugins:
  - name: birdnet-species
    pluginSpec:
      image: registry.sagecontinuum.org/beckman/birdnet-species:0.3.0
      args:
        - "--duration"
        - "20"
        - "--min-confidence"
        - "0.35"
        - "--save-match"
        # Archive a FLAC clip for any detection >= 0.5 (above the publish floor).
        # Remove this arg + value line to publish topics only, save no audio.
        - "*:0.5"
        # GEO-FILTERING via explicit coords (W06C manifest gps_lat/gps_lon).
        # WHY explicit and not live GPS: verified on 5680 (2026-07-11) that
        # --gps-subscribe FAILS here — the app opens a 3 s plugin.subscribe on
        # sys.gps.*, but W06C's device GPS only publishes every ~2 min, so the
        # 3 s window misses it ~always ("No node location available — geo-
        # filtering disabled"). W06C is a FIXED node, so its coords are stable;
        # passing them explicitly engages the eBird seasonal filter immediately.
        # FOLLOW-UP (pywaggle2): fix the live-GPS path to read the LAST cached
        # sys.gps.* value (data-API/pywaggle2) instead of a short subscribe, then
        # these two lines can be dropped in favor of self-location. See app.py
        # _coords_from_live_gps + read_node_location.
        - "--lat"
        - "43.9402"
        - "--lon"
        - "-110.6441"
nodes:
  W06C:
scienceRules:
  - "schedule(birdnet-species): cronjob('birdnet-w06c-gps-cron', '*/2 * * * *')"
successcriteria:
  - WallClock('30day')
